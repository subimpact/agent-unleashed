name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build / vet / test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # TEMPORARY diagnostic: report what a modern toolchain wants in go.mod.
      - name: tidy diff (diagnostic)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go version
          cp go.mod go.mod.orig && cp go.sum go.sum.orig
          go mod tidy || echo "TIDY-FAILED"
          echo "===== go.mod diff ====="
          diff -u go.mod.orig go.mod || true
          echo "===== go.sum diff (first 40) ====="
          diff -u go.sum.orig go.sum | head -40 || true
          echo "===== does it build after tidy? ====="
          go build ./... && echo "BUILD-OK-AFTER-TIDY" || echo "BUILD-FAILED-AFTER-TIDY"
          mv go.mod.orig go.mod && mv go.sum.orig go.sum

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./... -count=1

      # The race detector needs cgo, so it runs only where a C toolchain is
      # already present on the runner.
      - name: test -race
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./... -count=1

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
