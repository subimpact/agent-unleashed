# ==============================================================================
# Antigravity-Unleashed Configuration
# Autonomous 24/7 Agent Daemon & Multi-Channel Gateway for Antigravity
# ==============================================================================

system:
  agent_name: "Antigravity-Unleashed"
  workspace_dir: "."
  data_dir: "./data"
  skills_dir: "./.agents/skills"
  log_level: "INFO"

# LLM Backend Configuration
# Directly powered by your existing local Antigravity CLI (agy) — NO API KEY NEEDED!
model:
  provider: "agy"                  # Options: 'agy' (Primary), 'ollama' (Local), 'gemini'
  agy_binary_path: null            # Path to agy.exe (null auto-detects from PATH or AppData)
  effort: "high"                   # Reasoning effort: 'low', 'medium', 'high'
  auto_approve_tools: true         # Automatically execute tools without blocking (--dangerously-skip-permissions)
  model_name: "auto"
  api_key: ""

# Long-Term Persistent Memory (Semantic Vector + SQLite)
memory:
  enabled: true
  db_path: "./data/memory.sqlite"
  vector_dimension: 384
  similarity_threshold: 0.65
  max_context_memories: 5
  auto_ingest_conversations: true

# Autonomous Self-Reflection & Skill Learning
reflection:
  enabled: true
  auto_generate_skills: true
  auto_extract_facts: true
  min_tool_steps_for_reflection: 2

# Messaging Gateways (Enable the channels you want to run 24/7)
gateways:
  cli:
    enabled: true

  telegram:
    enabled: false
    bot_token: ""
    allowed_chat_ids: []
    admin_chat_id: null

  discord:
    enabled: false
    bot_token: ""
    guild_ids: []
    allowed_channel_ids: []

  rest_api:
    enabled: true
    host: "127.0.0.1"
    port: 8080
    webhook_secret: ""
