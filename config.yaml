# ==============================================================================
# Agent-Unleashed (agt-ul) Configuration
# Universal 24/7 Agent Gateway & Palace-Mnemosyne Memory Harness
# ==============================================================================

system:
  agent_name: "Agent-Unleashed"
  workspace_dir: "."
  data_dir: "./data"
  skills_dir: "./.agents/skills"
  log_level: "INFO"

# Primary Agent Driver & Pluggable CLI Adapters
# Options: 'auto' (Auto-detects installed AI CLIs), 'agy', 'claude', 'aider', 'hermes', 'ollama', 'api'
model:
  driver: "auto"
  effort: "high"                   # Reasoning effort: 'low', 'medium', 'high'
  auto_approve_tools: true         # Automatically execute tools without blocking
  model_name: "auto"
  ollama_endpoint: "http://localhost:11434"
  
  # Optional explicit paths if not in standard PATH
  agy_binary_path: ""
  claude_binary_path: ""
  aider_binary_path: ""
  hermes_binary_path: ""

  # Optional Cloud API Fallback Keys
  gemini_api_key: ""
  openrouter_api_key: ""
  anthropic_api_key: ""
  openai_api_key: ""

# Palace-Mnemosyne Cognitive Memory Engine
memory:
  enabled: true
  db_path: "./data/memory.sqlite"
  vector_dimension: 384
  similarity_threshold: 0.40
  max_context_memories: 5
  decay_half_life_days: 30.0       # Half-life for temporal memory decay (in days)
  auto_ingest_conversations: true

# Autonomous Self-Reflection & Skill Learning
reflection:
  enabled: true
  auto_generate_skills: true
  auto_extract_facts: true
  min_tool_steps_for_reflection: 2

# 24/7 Messaging Gateways
gateways:
  cli:
    enabled: true

  telegram:
    enabled: false
    bot_token: ""
    allowed_chat_ids: []
    admin_chat_id: null

  discord:
    enabled: false
    bot_token: ""
    guild_ids: []
    allowed_channel_ids: []

  rest_api:
    enabled: true
    host: "127.0.0.1"
    port: 8080
    webhook_secret: ""
